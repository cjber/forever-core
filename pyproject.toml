# The Python tools the gate runs, for Dependabot's uv ecosystem and `uv run --frozen --group dev`.
#
# This is not a package: nothing here is built or installed as one, and `uv.lock` pins the exact resolution. A tool
# version lives here once; workflows name the command, never the version. Pillow is here because the wowmock tests
# draw images with it.
[project]
name = "forever-tools"
version = "0.0.0"
description = "The linters and workflow checkers ForeverCore's gate runs"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "actionlint-py==1.7.12.25",
  "pillow==12.3.0",
  "ruff==0.16.8",
  "ty==0.0.83",
  "zizmor==1.30.1",
]
