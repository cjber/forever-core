<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>ForeverCore</title>
  <defs>
    <!-- Family palette: keep these four gradients unchanged in every addon. -->
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7a4f14"/>
    </linearGradient>
    <linearGradient id="emblem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b3741c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame and background: identical in every addon. -->
  <rect x="6" y="6" width="244" height="244" rx="28" fill="url(#gold)"/>
  <rect x="16" y="16" width="224" height="224" rx="20" fill="url(#bg)"/>

  <!-- Emblem: a cut gem, the core every Forever addon is set around. -->
  <path d="M128 36 L204 80 L204 168 L128 212 L52 168 L52 80 Z" fill="#000" opacity="0.45" transform="translate(4 5)"/>
  <path d="M128 36 L204 80 L204 168 L128 212 L52 168 L52 80 Z" fill="url(#emblem)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M128 80 L166 102 L166 146 L128 168 L90 146 L90 102 Z" fill="none" stroke="#5a360c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M128 36 L128 80 M204 80 L166 102 M204 168 L166 146 M128 212 L128 168 M52 168 L90 146 M52 80 L90 102" fill="none" stroke="#5a360c" stroke-width="4" stroke-linecap="round"/>
  <path d="M128 48 L194 86 L166 100 L128 78 L90 100 L62 86 Z" fill="url(#shine)"/>
</svg>
