# A library addon has no CurseForge or Wago page: this publishes the GitHub release, with the zip the packager builds,
# so a consumer can pin a version. Consumers adopt a core version with their own PR, not by installing this.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as CHANGELOG.md names it (for example 0.1.0)
        required: true
        type: string

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag a dispatched release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # A missing tag answers 404 with its error body on stdout, so branch on the exit status, not the output.
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null); then
            if [ "$existing" != "$RELEASE_COMMIT" ]; then
              echo "::error::$RELEASE_TAG already names $existing."
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > /dev/null
          fi
          # The packager reads the version from the tag on the checked-out commit; a full-history checkout may already hold it.
          git tag -f "$RELEASE_TAG" "$RELEASE_COMMIT"
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          # The packager reads GITHUB_OAUTH to create the GitHub release; GITHUB_TOKEN alone left it
          # without a token (the run packaged the zip but published nothing).
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
