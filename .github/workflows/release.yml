name: Release

on:
  push:
    tags: ["v*"]
  # A cloud agent session cannot push tags, so it releases from here: this run tags a main commit that passed full
  # CI and publishes it itself, since a tag created with GITHUB_TOKEN starts no workflow of its own.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as CHANGELOG.md names it (for example 1.0.0)
        required: true
        type: string
      commit:
        description: Full SHA of the main commit to release; main's head when empty
        required: false
        type: string
      skip_visual_proof:
        description: Accept a full CI run whose only failed job is visual-proof (a maintainer's waiver; the headless smoke still applies)
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # the packager creates the GitHub release; a manual release creates its tag
      # Read for release_check.py's CI runs, and write for the consumer sync this job starts itself: a tag a workflow
      # creates with GITHUB_TOKEN fires no push event.
      actions: write
      statuses: read # release_check.py reads the commit's headless-smoke status
    steps:
      - name: Choose the tag and commit
        id: target
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Manual releases run from main."
            exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must look like 1.2.3."
            exit 1
          fi
          commit=${COMMIT:-$GITHUB_SHA}
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::The commit must be a full 40-character SHA."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      # A release starts the moment its tag exists, which is normally while that commit's CI push run is still
      # going, so wait for the run here instead of failing on the race. A run that finished without success fails the
      # release at once, and the gate below still publishes only a completed, successful full CI run on main for this
      # exact commit.
      - name: Wait for full CI on the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          SKIP_VISUAL_PROOF: ${{ inputs.skip_visual_proof }}
        run: |
          for attempt in $(seq 1 90); do
            state=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT&event=push&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main")] | if length == 0 then "none/" else (max_by(.run_started_at) | "\(.status)/\(.conclusion // "")") end') || state="unreadable/"
            case "$state" in
              completed/success)
                echo "Full CI on main is green for $RELEASE_COMMIT"
                exit 0
                ;;
              completed/failure)
                # The next step decides whether visual-proof is the only failed job, the one failure the skip waives.
                if [ "$SKIP_VISUAL_PROOF" = "true" ]; then
                  echo "Full CI on main failed for $RELEASE_COMMIT; the release check decides whether the skip covers it"
                  exit 0
                fi
                echo "::error::Full CI on main finished without success ($state) for $RELEASE_COMMIT"
                exit 1
                ;;
              completed/*)
                echo "::error::Full CI on main finished without success ($state) for $RELEASE_COMMIT"
                exit 1
                ;;
              none/*)
                echo "::error::No full CI push run on main for $RELEASE_COMMIT"
                exit 1
                ;;
            esac
            echo "Full CI on main is $state for $RELEASE_COMMIT; waiting (${attempt} of 90)"
            sleep 20
          done
          echo "::error::Full CI on main is still running for $RELEASE_COMMIT after 30 minutes"
          exit 1
      # release_check.py passes only a commit whose full CI push run on main succeeded and whose headless-smoke status
      # is green, so a manual release cannot publish a branch, a pull request, an unchecked commit or a build nobody
      # loaded in the client.
      - name: Verify full CI and the headless smoke on the commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          SKIP_VISUAL_PROOF: ${{ inputs.skip_visual_proof }}
        run: |
          python3 -c 'import os; os.environ["GITHUB_SHA"] = os.environ["RELEASE_COMMIT"]
          from tools.release_check import main
          main(["--skip-visual-proof"] if os.environ.get("SKIP_VISUAL_PROOF") == "true" else [])'
      # The release notes are this version's CHANGELOG entry, not the whole file;
      # a tag without one fails here rather than shipping empty notes, and so does a commit that still holds
      # changes/ fragments, which the package would otherwise ship.
      - name: Release notes
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          python3 tools/changelog.py --check "$RELEASE_TAG"
          python3 tools/changelog.py "$RELEASE_TAG" > .release-notes.md
      - name: Tag a manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN cannot create a ref that brings in .github/workflows changes since the last tag (HTTP 403).
          # CONSUMER_SYNC_TOKEN, the fine-grained PAT with Contents, Workflows and Actions write, can.
          SYNC_TOKEN: ${{ secrets.CONSUMER_SYNC_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          # A missing tag answers 404 with its error body on stdout, so branch on the exit status, not the output.
          if found=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '"\(.object.type) \(.object.sha)"' 2>/dev/null); then
            read -r kind existing <<< "$found"
            # A signed or annotated tag names a tag object, not the commit: peel it to the commit it tags.
            while [ "$kind" = tag ]; do
              found=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$existing" --jq '"\(.object.type) \(.object.sha)"')
              read -r kind existing <<< "$found"
            done
            if [ "$existing" != "$RELEASE_COMMIT" ]; then
              echo "::error::$RELEASE_TAG already names $existing."
              exit 1
            fi
          elif gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > /dev/null 2>&1; then
            : # A tag GITHUB_TOKEN creates starts no run, so this run publishes it.
          elif [ -n "$SYNC_TOKEN" ] && GH_TOKEN=$SYNC_TOKEN gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT" > /dev/null; then
            # A tag the PAT creates starts its own Release run, which publishes it; this run stops so nothing ships twice.
            echo "::notice::Tagged $RELEASE_TAG with CONSUMER_SYNC_TOKEN; its tag push run publishes the release."
            GH_TOKEN=$SYNC_TOKEN gh run cancel "$GITHUB_RUN_ID" || true
            sleep 60
            echo "::error::Tagged $RELEASE_TAG, but this run could not cancel itself; the tag push run publishes the release."
            exit 1
          else
            echo "::error::Could not create $RELEASE_TAG: GITHUB_TOKEN cannot tag a commit that brings in .github/workflows changes. Set the CONSUMER_SYNC_TOKEN secret, or push a signed $RELEASE_TAG on $RELEASE_COMMIT by hand: its tag push run publishes the release."
            exit 1
          fi
          # The packager reads the version from the tag on the checked-out commit. The full-history checkout
          # already holds a tag that existed before this run, so only a new one is created here.
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null || git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 predates $/
        with:
          tools: lua
      # The packager fills @project-version@ with the tag, v and all; write the bare version first.
      - name: Write the bare version into the TOC
        env:
          PYTHONPATH: .agents/skills/wow-forever-addon/tooling
        run: python3 -m forever_tools.toc_version
      # The standalone ships wrapped like an embedded copy, so it joins the loader's election (#946). Wrap it before the
      # released-consumer exercise, so that exercise loads the layout players get.
      - name: Wrap the standalone for the loader
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: tools/wrap_standalone.sh "$RELEASE_TAG"
      # A core release reaches players before the consumers are re-released, so the exact candidate is loaded with
      # every consumer's latest released build here, after CI passed and before anything is packaged or uploaded.
      - name: Exercise the released consumer builds
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_SIM_CACHE: ${{ github.workspace }}/.cache/release-sim
        run: |
          python3 .agents/skills/wow-forever-addon/tooling/forever_sim/fetch.py
          python3 tools/suite_load.py --released -v
      - name: Build the release zip without uploading
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d
      - name: Exercise the built release zip
        id: validated
        env:
          FOREVER_SIM_CACHE: ${{ github.workspace }}/.cache/release-sim
        run: |
          python3 .agents/skills/wow-forever-addon/tooling/forever_sim/fetch.py
          python3 tools/check_release_archive.py
      - name: Verify the validated archive has not changed
        env:
          ARCHIVE: ${{ steps.validated.outputs.archive }}
          ARCHIVE_SHA256: ${{ steps.validated.outputs.sha256 }}
        run: printf '%s  %s\n' "$ARCHIVE_SHA256" "$ARCHIVE" | sha256sum --check --status
      # This pinned packager keeps inherited archive metadata when -z skips archive creation. -c also skips
      # copying: its upload functions consume this exact validated zip, never a second generated artifact.
      - name: Upload the validated package
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -c -z
        env:
          archive: ${{ steps.validated.outputs.archive }}
          archive_name: ${{ steps.validated.outputs.archive_name }}
          archive_label: ${{ steps.validated.outputs.archive_label }}
          archive_version: ${{ steps.target.outputs.tag }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # A tag a workflow creates with GITHUB_TOKEN fires no push event, so sync-consumers.yml does not hear about this
      # release on its own. Start it here, after the packager: that run moves every consumer's ForeverCore pin to the
      # release just published, alongside the tooling sync.
      - name: Start the consumer sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-consumers.yml --ref main
