name: Suite load

# Every published Forever addon's main, loaded together with this repo under forever_sim and exercised. It reads the
# consumers' main branches, so it runs on a schedule and on demand rather than on a pull request here: a core change
# must not wait on another repository's main. Run it before a release with `gh workflow run suite.yml`.
on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOREVER_SIM_CACHE: ${{ github.workspace }}/.cache/forever_sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          # Fall back to Canonical's signed mirrors when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$mirror_list"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/forever_sim
          key: forever-sim-${{ hashFiles('.agents/skills/wow-forever-addon/tooling/forever_sim/fetch.py') }}
      - run: python3 .agents/skills/wow-forever-addon/tooling/forever_sim/fetch.py
      - run: python3 tools/suite_load.py -v
