name: Forever tooling

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# PyPI answers 502/504 under load; pip's own retries cover it.
env:
  PIP_RETRIES: 5
  PIP_DEFAULT_TIMEOUT: 60

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.10', '3.14']
    defaults:
      run:
        working-directory: .agents/skills/wow-forever-addon/tooling
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # forever_tools.locales parses each translation with LuaJIT, and its tests run that path.
      # Ubuntu 24.04's release-pocket build, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - run: python3 -m unittest discover -s tests -t .
      - run: python3 forever_tools/sync.py check --allow-unpinned
      - run: pipx run ruff==0.16.8 check .
      - run: pipx run ruff==0.16.8 format --check .
      # tweaks-forever type-checks its tools/ with ty, the vendored copy included.
      - if: matrix.python == '3.10'
        run: pipx run ty==0.0.83 check --python-version 3.10 forever_tools
