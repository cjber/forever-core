name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deadcode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/deadcode.py --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog check compares each released section with its v* tag, so it needs the tags.
          fetch-depth: 0
          persist-credentials: false
      # Every tool version below lives in this checkout's toolchain.json, which the action reads (its manifest input
      # defaults to that file, resolved against the workspace) and installs and verifies each pin from.
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 predates $/
        id: toolchain
        with:
          tools: lua stylua
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.toolchain.outputs.python }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: luacheck .
      - run: python3 .agents/skills/wow-forever-addon/tooling/forever_tools/specs.py
      # The client's callable names are generated data: a hand edit, or a UI pin that moved without regenerating,
      # fails here. The UI source is fetched at its pin into the gitignored cache.
      - name: Client names data
        run: python3 tools/gen_forever_api.py --check
      # The host spec runs Blizzard's own tracker source, fetched at a pinned revision.
      - name: Native tracker integration
        run: |
          python3 tools/fetch_tracker_ui.py
          TRACKER_UI_ROOT=tools/.cache/tracker-ui luajit tests/tracker_host_spec.lua
      - run: stylua --check .
      # The Python tools are pyproject.toml's dev group, resolved in uv.lock.
      - run: uv run --frozen --group dev ruff check tools
      - run: uv run --frozen --group dev ruff format --check tools
      - run: python3 -m unittest discover -s tools -p "test_*.py"
      # A merge that edits a section whose v* tag already shipped fails here: new notes belong under Unreleased.
      - run: python3 tools/changelog.py --check
      # The wowmock renderer's tests draw images, so they run with Pillow from the dev group.
      - run: uv run --frozen --group dev python -m unittest discover -s tools/wowmock -p "test_*.py"
      - run: python3 tools/check_assets.py

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 predates $/
        with:
          tools: luals
      - run: bash tools/typecheck.sh

  # The rules no linter covers, which every addon vendors (WFA-36, WFA-37).
  project-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The name rule reads the lines a pull request adds, which needs its base commit in the checkout.
          fetch-depth: 0
          persist-credentials: false
      - run: python3 tools/check_client_load.py
      - run: python3 tools/check_slash_words.py
      - run: python3 tools/check_menu_scroll.py
      - name: Check the ForeverCore name in this change
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/check_core_name.py --base "$BASE"
      - run: python3 tools/check_core_name.py
      - run: python3 tools/check_api_docs.py

  visual-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify client visual proof
        env:
          PYTHONPATH: .agents/skills/wow-forever-addon/tooling
          VISUAL_BASE: ${{ github.event.pull_request.base.sha || (github.ref == 'refs/heads/main' && github.event.before) || 'origin/main' }}
        run: python3 tools/check_visual_proof.py --base "$VISUAL_BASE"

  packaged:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 predates $/
        id: toolchain
      # What a tag would ship: the packager without uploading or zipping, then every file the TOC loads must be in it
      # and no development folder may be.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -z
      - run: python3 tools/check_package.py
      - name: Parse packaged Lua with the client grammar
        env:
          LUA51_LUAC: ${{ steps.toolchain.outputs.lua_prefix }}/bin/luac5.1
        run: python3 tools/check_lua51.py .release/ForeverCore
      - name: Exercise the packaged addon
        env:
          FOREVER_SIM_CACHE: ${{ github.workspace }}/.cache/forever_sim
        run: |
          python3 .agents/skills/wow-forever-addon/tooling/forever_sim/fetch.py
          cd .release/ForeverCore
          test -f ForeverCore.toc
          test "$PWD" != "$GITHUB_WORKSPACE"
          luajit "$GITHUB_WORKSPACE/.agents/skills/wow-forever-addon/tooling/forever_sim/run.lua" \
            "$GITHUB_WORKSPACE/tests/sim/exercise_scenario.lua"

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 predates $/
        with:
          tools: gitleaks
      - name: gitleaks
        run: gitleaks git --redact --no-banner .

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --frozen --group dev actionlint
      # The consumer workflow templates every addon vendors from here.
      - run: uv run --frozen --group dev actionlint tools/core-shared-drift.yml tools/visual-proof.yml
      - run: uv run --frozen --group dev zizmor --offline .github tools/core-shared-drift.yml tools/visual-proof.yml
