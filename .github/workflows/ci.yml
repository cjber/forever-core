name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PyPI answers 502/504 under load; pip's own retries cover it.
env:
  PIP_RETRIES: 5
  PIP_DEFAULT_TIMEOUT: 60

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deadcode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/deadcode.py --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - run: luacheck .
      - run: python3 .agents/skills/wow-forever-addon/tooling/forever_tools/specs.py
      # The host spec runs Blizzard's own tracker source, fetched at a pinned revision.
      - name: Native tracker integration
        run: |
          python3 tools/fetch_tracker_ui.py
          TRACKER_UI_ROOT=tools/.cache/tracker-ui luajit tests/tracker_host_spec.lua
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - run: pipx run ruff==0.16.8 check tools
      - run: pipx run ruff==0.16.8 format --check tools
      - run: python3 -m unittest discover -s tools -p "test_*.py"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install pillow==12.3.0
      - run: python3 -m unittest discover -s tools/wowmock -p "test_*.py"
      - run: python3 tools/check_assets.py

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LuaLS 3.19.1
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -sSfL -o "$RUNNER_TEMP/luals.tar.gz" https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  $RUNNER_TEMP/luals.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - run: bash tools/typecheck.sh

  # The rules no linter covers, which every addon vendors (WFA-36, WFA-37).
  project-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/check_client_load.py
      - run: python3 tools/check_menu_scroll.py
      - run: python3 tools/check_api_docs.py

  packaged:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Ubuntu 24.04's release-pocket build, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      # What a tag would ship: the packager without uploading or zipping, then every file the TOC loads must be in it
      # and no development folder may be.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -z
      - run: python3 tools/check_package.py

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks && rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec actionlint-py==1.7.12.25 actionlint
      # The drift workflow every consumer vendors from here.
      - run: pipx run --spec actionlint-py==1.7.12.25 actionlint tools/core-shared-drift.yml
      - run: pipx run zizmor==1.30.1 --offline .github tools/core-shared-drift.yml
