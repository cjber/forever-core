name: Forever sim

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .agents/skills/wow-forever-addon/tooling
    env:
      FOREVER_SIM_CACHE: ${{ github.workspace }}/.cache/forever_sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/lua-toolchain # zizmor: ignore[self-repository] actionlint 1.7.12 predates $/
      # Blizzard's UI source and the client tables are fetched at test time, never committed; the cache key is the
      # fetcher, which holds the pinned revision and build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/forever_sim
          key: forever-sim-${{ hashFiles('.agents/skills/wow-forever-addon/tooling/forever_sim/fetch.py') }}
      - run: python3 forever_sim/fetch.py --locale deDE
      - run: luacheck forever_sim tests/sim
      - run: python3 forever_tools/specs.py --pattern 'tests/sim/*_spec.lua'
      - name: Shared map canvas scenario
        working-directory: .
        run: luajit .agents/skills/wow-forever-addon/tooling/forever_sim/run.lua tests/sim
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check --indent-type Tabs --column-width 120 .agents/skills/wow-forever-addon/tooling/forever_sim .agents/skills/wow-forever-addon/tooling/tests/sim
