name: Sync consumers

# Every consumer carries a copy of this repo's development tooling and pins the ForeverCore release its specs and CI
# check out. A push to main refreshes those copies in one PR per consumer, with squash auto-merge armed so the
# consumer's own checks decide when it lands. release.yml starts the same sync once a release is published, which
# moves every pin to that release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-consumers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync every consumer
        env:
          # Fine-grained PAT with Contents, Pull requests, Workflows and Actions write on the consumers, the private
          # kiln-forever repository included (Actions because release-consumers.yml dispatches their release.yml). When
          # it is unset the script prints a notice and the job stays green; a token without access to kiln-forever
          # reports that consumer as failed in the run summary rather than skipping it silently.
          GH_TOKEN: ${{ secrets.CONSUMER_SYNC_TOKEN }}
        run: python3 tools/sync_consumer_prs.py
      # A release starts this workflow after publishing a new core. The scheduled consumer release is a backstop,
      # not the hand-off: dispatch it now so a landed sync entry is released without waiting for the next cron tick.
      - name: Start consumer releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release-consumers.yml --ref main
